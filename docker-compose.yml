services:
  postgres:
    image: postgres:16
    container_name: stabilityos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"

  backend:
    build: ./backend
    container_name: stabilityos-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      STABILITYOS_API_KEY: ${STABILITYOS_API_KEY}
      STABILITYOS_SCHEDULER_ENABLED: ${STABILITYOS_SCHEDULER_ENABLED:-false}
      STABILITYOS_DAILY_BRIEF_CRON: ${STABILITYOS_DAILY_BRIEF_CRON:-0 30 8 * * *}
      STABILITYOS_TIMEZONE: ${STABILITYOS_TIMEZONE:-Asia/Kolkata}
      STABILITYOS_TELEGRAM_ENABLED: ${STABILITYOS_TELEGRAM_ENABLED:-false}
      STABILITYOS_TELEGRAM_BOT_TOKEN: ${STABILITYOS_TELEGRAM_BOT_TOKEN:-}
      STABILITYOS_TELEGRAM_CHAT_ID: ${STABILITYOS_TELEGRAM_CHAT_ID:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8080"

volumes:
  postgres_data: