spring:
  application:
    name: stabilityos-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stabilityos}
    username: ${DB_USER:stabilityos}
    password: ${DB_PASSWORD:stabilityos_dev_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

stabilityos:
  api-key: ${STABILITYOS_API_KEY}

  scheduler:
    enabled: ${STABILITYOS_SCHEDULER_ENABLED:false}
    daily-brief-cron: "${STABILITYOS_DAILY_BRIEF_CRON:0 30 8 * * *}"
    timezone: "${STABILITYOS_TIMEZONE:Asia/Kolkata}"

  delivery:
    telegram:
      enabled: ${STABILITYOS_TELEGRAM_ENABLED:false}
      bot-token: ${STABILITYOS_TELEGRAM_BOT_TOKEN:}
      chat-id: ${STABILITYOS_TELEGRAM_CHAT_ID:}